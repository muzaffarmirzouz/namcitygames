<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NamCityGames</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root{
    --ink:#0b0a10;
    --surface:#151220;
    --surface-2:#1c1830;
    --line:rgba(255,255,255,0.09);
    --text:#f3f1f8;
    --muted:#948fa8;
    --red:#ff3b40;
    --red-dim:#ff3b4022;
    --blue:#3f7cfb;
    --blue-dim:#3f7cfb22;
    --glow-red:#ff3b4055;
    --glow-blue:#3f7cfb55;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;} }
  body{
    margin:0;
    background:
      radial-gradient(1100px 620px at 14% -8%, var(--red-dim), transparent 60%),
      radial-gradient(1200px 680px at 88% 8%, var(--blue-dim), transparent 60%),
      var(--ink);
    color:var(--text);
    font-family:'Onest', system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;}
  img{max-width:100%; display:block;}
  .mono{font-family:'JetBrains Mono', ui-monospace, monospace;}
  .display{font-family:'Unbounded', 'Onest', sans-serif;}
  .wrap{max-width:1120px; margin:0 auto; padding-inline:24px;}
  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(11,10,16,0.72);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding-block:12px;
    gap:16px;
  }
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none;}
  .brand img{height:30px; width:auto;}
  .brand span{
    font-family:'Unbounded', sans-serif; font-weight:700; font-size:15px;
    letter-spacing:0.02em;
  }
  .brand .g{color:var(--blue);}
  .brand .n{color:var(--red);}
  .langs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px;}
  .langs button{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; font-weight:600; letter-spacing:0.04em;
    padding:6px 12px; border-radius:999px; border:none;
    background:transparent; color:var(--muted); cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .langs button:hover{color:var(--text);}
  .langs button.active{background:linear-gradient(135deg, var(--red), var(--blue)); color:#0b0a10;}
  .langs button:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
  /* ---------- hero ---------- */
  .hero{
    position:relative;
    padding-block:88px 72px;
    text-align:center;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(60% 55% at 50% 20%, #000 0%, transparent 75%);
            mask-image:radial-gradient(60% 55% at 50% 20%, #000 0%, transparent 75%);
    opacity:0.7;
    pointer-events:none;
  }
  .hero-logo{width:min(420px, 72vw); margin:0 auto 28px; position:relative; z-index:1;}
  .hero .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--muted); margin-bottom:18px; position:relative; z-index:1;
  }
  .hero .eyebrow .dot{width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 0 3px var(--red-dim);}
  .hero h1{
    font-size:clamp(28px, 4.4vw, 44px);
    font-weight:600;
    margin:0 0 14px;
    text-wrap:balance;
    color:var(--text);
    position:relative; z-index:1;
  }
  .hero p.lede{
    max-width:56ch; margin:0 auto 34px; color:var(--muted); font-size:16px;
    position:relative; z-index:1;
  }
  .hero .cta-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; position:relative; z-index:1;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:13px 22px; border-radius:12px; text-decoration:none;
    font-weight:600; font-size:14.5px; border:1px solid transparent;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
  .btn-primary{background:linear-gradient(135deg, var(--red), var(--blue)); color:#0b0a10;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--surface); border-color:var(--line); color:var(--text);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn svg{width:16px; height:16px; flex:none;}
  /* ---------- stat strip ---------- */
  .stats{
    border-block:1px solid var(--line);
    background:rgba(255,255,255,0.015);
  }
  .stats-inner{
    display:grid; grid-template-columns:repeat(3,1fr);
    text-align:center;
  }
  .stat{padding:26px 12px; position:relative;}
  .stat + .stat::before{
    content:""; position:absolute; left:0; top:18%; bottom:18%; width:1px; background:var(--line);
  }
  .stat .num{font-family:'Unbounded', sans-serif; font-weight:700; font-size:clamp(20px,3vw,30px); font-variant-numeric:tabular-nums;}
  .stat .num.red{color:var(--red);}
  .stat .num.blue{color:var(--blue);}
  .stat .cap{margin-top:6px; font-size:12.5px; color:var(--muted); letter-spacing:0.03em;}
  /* ---------- section shell ---------- */
  section{padding-block:76px;}
  .kicker{
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--muted); margin:0 0 10px; display:flex; align-items:center; gap:10px;
  }
  .kicker::after{content:""; height:1px; flex:1; background:var(--line);}
  .kicker::before{content:""; width:16px; height:1px; background:var(--red);}
  h2.section-title{
    font-family:'Unbounded', sans-serif; font-weight:700;
    font-size:clamp(24px,3.4vw,34px); margin:0 0 12px; text-wrap:balance;
  }
  .section-sub{color:var(--muted); max-width:60ch; margin:0 0 40px; font-size:15.5px;}
  /* ---------- services / pricing ---------- */
  .cards-2{display:grid; grid-template-columns:1.1fr 1fr; gap:22px; align-items:stretch;}
  @media (max-width:820px){ .cards-2{grid-template-columns:1fr;} }
  .service-card{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:30px; position:relative; overflow:hidden;
  }
  .service-card::after{
    content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%;
    background:radial-gradient(circle, var(--blue-dim), transparent 70%);
  }
  .service-card h3{font-family:'Unbounded', sans-serif; font-size:19px; margin:0 0 10px; position:relative;}
  .service-card p{color:var(--muted); font-size:14.5px; margin:0 0 22px; position:relative;}
  .spec-list{list-style:none; margin:0; padding:0; display:grid; gap:10px; position:relative;}
  .spec-list li{
    display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--text);
  }
  .spec-list li svg{width:15px; height:15px; color:var(--blue); flex:none;}
  .price-stack{display:grid; gap:14px;}
  .price-ticket{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:20px 22px; display:flex; align-items:center; justify-content:space-between; gap:14px;
    position:relative;
  }
  .price-ticket.vip{border-color:var(--red);}
  .price-ticket .ptitle{font-weight:600; font-size:15px;}
  .price-ticket .ptag{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .price-ticket .pval{font-family:'JetBrains Mono', monospace; font-weight:600; font-size:19px; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .price-ticket.vip .pval{color:var(--red);}
  .price-ticket:not(.vip) .pval{color:var(--blue);}
  .price-note{font-size:12px; color:var(--muted); margin-top:2px;}
  /* ---------- branches ---------- */
  .branches{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  @media (max-width:820px){ .branches{grid-template-columns:1fr;} }
  .branch-card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px 26px;
  }
  .branch-card::before, .branch-card::after{
    content:""; position:absolute; width:22px; height:22px; border-color:inherit; opacity:0.9;
  }
  .branch-card.red{--accent:var(--red);}
  .branch-card.blue{--accent:var(--blue);}
  .branch-card::before{ top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); border-radius:20px 0 0 0;}
  .branch-card::after{ bottom:-1px; right:-1px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent); border-radius:0 0 20px 0;}
  .branch-head{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .branch-dot{width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent);}
  .branch-card h3{font-family:'Unbounded', sans-serif; font-size:17px; margin:0;}
  .branch-id{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); margin-left:auto;}
  .branch-row{display:flex; gap:12px; padding-block:10px; border-top:1px solid var(--line);}
  .branch-row:first-of-type{border-top:none; padding-top:0;}
  .branch-row svg{width:17px; height:17px; color:var(--accent); flex:none; margin-top:2px;}
  .branch-row .label{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:2px;}
  .branch-row .val{font-size:14.5px;}
  .branch-row a.val{text-decoration:none;}
  .branch-row a.val:hover{text-decoration:underline;}
  .phone-list{display:flex; flex-direction:column; gap:4px;}
  .phone-list a{font-family:'JetBrains Mono', monospace; font-size:14px; text-decoration:none;}
  .phone-list a:hover{text-decoration:underline;}
  /* ---------- contact / footer ---------- */
  .contact-band{
    border-top:1px solid var(--line);
    background:linear-gradient(180deg, transparent, rgba(255,255,255,0.02));
  }
  .contact-inner{
    display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
    padding-block:44px;
  }
  .contact-inner h2{font-family:'Unbounded', sans-serif; font-size:clamp(20px,2.6vw,26px); margin:0 0 6px; text-wrap:balance;}
  .contact-inner p{color:var(--muted); margin:0; font-size:14.5px;}
  .social-row{display:flex; gap:10px; flex-wrap:wrap;}
  footer{border-top:1px solid var(--line); padding-block:26px;}
  .foot-inner{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--muted);}
  .foot-inner .brand span{font-size:12.5px;}
  .foot-inner img{height:18px;}
</style>
</head>

  function get(obj, path){
    return path.split('.').reduce(function(o,k){ return (o && o[k] !== undefined) ? o[k] : null; }, obj);
  }
  function applyLang(lang){
    var dict = translations[lang] || translations.uz;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var val = get(dict, el.getAttribute('data-i18n'));
      if (val !== null) el.textContent = val;
    });
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-lang-btn]').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang-btn') === lang);
    });
    try { localStorage.setItem('ncg-lang', lang); } catch(e) {}
  }
  var initial = 'uz';
  try {
    var saved = localStorage.getItem('ncg-lang');
    if (saved && translations[saved]) initial = saved;
  } catch(e) {}
  document.querySelectorAll('[data-lang-btn]').forEach(function(btn){
    btn.addEventListener('click', function(){ applyLang(btn.getAttribute('data-lang-btn')); });
  });
  applyLang(initial);
})();
